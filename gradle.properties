pluginGroup=ru.mythographica.mnemographica
pluginVersion=0.1.0
pluginSinceBuild=262

# Local OpenIDE installation used for compiling, tests and runIde.
# Override with -PplatformLocalPath=... (or switch build.gradle.kts to intellijIdea(...) for CI).
platformLocalPath=/Applications/OpenIDE Pro.app

# verifyPlugin target: IntelliJ IDEA of the same 262 branch as OpenIDE Pro 2026.2.3.
verifyIdeVersion=2026.2.3

# Run `npm ci && npm run build` in sidecar/ before prepareSandbox and bundle sidecar/dist as <plugin>/sidecar.
# Off until WP2 (sidecar) lands; flip to true or pass -PbuildSidecar=true.
buildSidecar=true

# The platform ships kotlin-stdlib and kotlinx-coroutines; do not bundle them.
kotlin.stdlib.default.dependency=false

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=false
