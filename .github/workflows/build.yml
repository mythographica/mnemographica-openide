name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sidecar/package-lock.json

      # JDK 25: the 262 platform and this plugin's Kotlin/Java target are Java 25.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # npm test builds sidecar/dist first (pretest), so Gradle reuses it with -PbuildSidecar=false.
      - name: Sidecar tests
        working-directory: sidecar
        run: |
          npm ci
          npm test

      # OpenIDE is not available on the runner: -PciPlatform=true compiles and verifies against IntelliJ IDEA 262.
      - name: Build and verify plugin
        run: ./gradlew buildPlugin verifyPlugin -PciPlatform=true -PbuildSidecar=false --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mnemographica-openide
          path: build/distributions/*.zip
